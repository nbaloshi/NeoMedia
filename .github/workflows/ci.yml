name: NeoMedia CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: neomediaacr2026.azurecr.io
  ACR_NAME: neomediaacr2026
  RESOURCE_GROUP: neomedia-rg
  BACKEND_APP: neomedia-backend
  FRONTEND_APP: neomedia-frontend
  FRONTEND_API_URL: https://neomedia-backend.purplepond-e279aa66.uaenorth.azurecontainerapps.io

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Build backend Docker image
        run: docker build -t neomedia-backend:ci ./backend

      - name: Log in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "$ACR_NAME"

      - name: Push backend images to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for tag in "$GITHUB_SHA" latest; do
            IMAGE="$REGISTRY/neomedia-backend:$tag"
            docker tag neomedia-backend:ci "$IMAGE"
            docker push "$IMAGE"
          done

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL="$FRONTEND_API_URL" \
            -t neomedia-frontend:ci \
            ./frontend

      - name: Log in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "$ACR_NAME"

      - name: Push frontend images to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for tag in "$GITHUB_SHA" latest; do
            IMAGE="$REGISTRY/neomedia-frontend:$tag"
            docker tag neomedia-frontend:ci "$IMAGE"
            docker push "$IMAGE"
          done

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/neomedia-backend:$GITHUB_SHA"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/neomedia-frontend:$GITHUB_SHA"

      - name: Show deployed images
        run: |
          echo "Backend:"
          az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[].image" -o tsv

          echo "Frontend:"
          az containerapp show \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[].image" -o tsv
